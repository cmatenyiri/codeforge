# Serves the built app, and nothing else. Routing to the backend is the job of
# the nginx in front of this one — see codeforge-orchestration/nginx/.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in every asset's name, so a changed file is a new
    # URL and these never need to be asked about again.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is a client-side route, answered with the app itself —
    # revalidated each time, so a new build is picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
