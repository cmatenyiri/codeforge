buildscript {
    repositories {
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
    }

    dependencies {
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.4.8'
        classpath 'se.bjurr.violations:violations-gradle-plugin:4.1.2'
    }
}

apply plugin: 'checkstyle'
apply plugin: 'pmd'
apply plugin: com.github.spotbugs.snom.SpotBugsPlugin
apply plugin: se.bjurr.violations.gradle.plugin.ViolationsGradlePlugin

def configDir = buildscript.sourceFile.parentFile
def javaVersion = Integer.valueOf(JavaVersion.current().toString())

checkstyle {
    toolVersion = '13.3.0'
    ignoreFailures = true
    configFile = file("${configDir}/checkstyle.xml")
}

spotbugs {
    toolVersion = '4.9.8'
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file("${configDir}/spotbugs-filter.xml")
}

spotbugsMain {
    reports {
        xml.enabled = true
    }
}

pmd {
    toolVersion = javaVersion  > 17 ? '7.22.0' : '6.45.0'
    ignoreFailures = true
    ruleSetFiles = files("${configDir}/pmd-ruleset.xml")
    ruleSets = []
    rulesMinimumPriority = 5
    try {
        incrementalAnalysis = true
    } catch (def e) {
    }
}

task violations(type: se.bjurr.violations.gradle.plugin.ViolationsTask) {
    maxRuleColumnWidth.set(35)
    maxMessageColumnWidth.set(120)

    minSeverity.set(se.bjurr.violations.lib.model.SEVERITY.INFO) // INFO, WARN or ERROR
    detailLevel.set(se.bjurr.violations.git.ViolationsReporterDetailLevel.VERBOSE) // PER_FILE_COMPACT, COMPACT or VERBOSE
    maxViolations.set(0) // Will fail the build if total number of found violations is higher

    violations = [
            ["FINDBUGS", buildDir.path, ".*/spotbugs/.*\\.xml\$", "SpotBugs"],
            ["PMD", buildDir.path, ".*/pmd/.*\\.xml\$", "PMD"],
            ["CHECKSTYLE", buildDir.path, ".*/checkstyle/.*\\.xml\$", "Checkstyle"]
    ]
}

check.finalizedBy violations
