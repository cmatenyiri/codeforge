server:
  port: 8080

spring:
  application:
    name: codeforge-backend

  datasource:
    # `createDatabaseIfNotExist` keeps first-run friction low; everything inside
    # the database is Liquibase's job (see `liquibase` below).
    url: jdbc:mysql://localhost:3306/codeforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: codeforge
    password: codeforge
    driver-class-name: com.mysql.cj.jdbc.Driver

  # The one owner of the schema: every table, the Quartz ones included, and the
  # first admin account. Runs before JPA and Quartz start, and when several
  # instances start at once only one of them applies the changes — the others
  # wait on its lock. See db/changelog/db.changelog-master.xml.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    # Hibernate only checks that the entities match the tables Liquibase made,
    # and refuses to start if they do not. It never changes the schema itself.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  # Run and submit answer asynchronously: the request thread is let go while the
  # judge works, and the response is written when Judge0 calls back. Tomcat's
  # own default of 30s would cut a slow submission off, so this has to outlast
  # `codeforge.execution.judge0.result-timeout` with room to spare.
  mvc:
    async:
      request-timeout: PT90S

  # Shared by every backend instance: AMQP carries Judge0 callbacks between
  # them, and `codeforge.websocket.relay` below is the STOMP side of the same
  # broker. See codeforge-orchestration/docker-compose.yml.
  rabbitmq:
    host: localhost
    port: 5672
    username: codeforge
    password: codeforge

  quartz:
    # Triggers are stored in this database, so they outlive a restart: one that
    # fell due while the server was down counts as misfired, and Quartz fires it
    # as soon as the scheduler starts again. Scheduling from inside a
    # @Transactional method joins that transaction, so a trigger commits or rolls
    # back with the change that set it.
    job-store-type: jdbc
    jdbc:
      # The QRTZ_ tables come from Liquibase (changes/002-quartz-schema.xml).
      initialize-schema: never
    # Clustered, because several backend instances can share this database —
    # the Docker setup runs two. Without it each instance would fire every
    # contest alarm; clustered, they share the triggers through row locks in
    # QRTZ_LOCKS and exactly one of them fires each. An instance that dies
    # mid-job is noticed by the others' check-ins, and its recoverable jobs are
    # run again elsewhere. A single instance is simply a cluster of one.
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true

logging:
  level:
    # Netty looks for its native macOS DNS library as soon as the STOMP relay's
    # TCP client loads, and logs an ERROR when it is absent. Nothing depends on
    # it: the relay resolves through the JVM instead (see WebSocketConfig).
    io.netty.resolver.dns.DnsServerAddressStreamProviders: 'OFF'

codeforge:
  jwt:
    # Dev-only secret. Must be at least 32 bytes for HS256 — move this to an
    # environment variable before anything leaves localhost.
    secret: 8f2b41d6c07e4a95b3d18ea27c5f60934ab7de815c26f0a94db3e57816cf2a0d
    issuer: codeforge
    access-token-ttl: PT12H
    cookie:
      name: codeforge_token
      # `secure` must be true anywhere reachable over HTTPS; it is false here
      # only so the cookie survives plain-HTTP localhost.
      secure: false
      same-site: Lax
      path: /

  cors:
    allowed-origins:
      - http://localhost:5173

  websocket:
    # The STOMP broker the WebSocket endpoint relays to. An in-memory broker
    # would only reach browsers connected to this instance; relaying to RabbitMQ
    # is what lets an event raised on one instance reach all of them.
    relay:
      host: localhost
      port: 61613
      login: codeforge
      passcode: codeforge
      virtual-host: /

  execution:
    judge0:
      base-url: http://localhost:2358
      # Unauthenticated because it is bound to localhost and reachable from
      # nowhere else. Set a token before that changes, and never expose an open
      # instance — it runs arbitrary code by design.
      auth-token:
      # Instance-specific: `GET /languages` lists what the running image actually
      # has. These are the ids in judge0/judge0:1.13.1.
      language-ids:
        JAVA: 62 # OpenJDK 13.0.1
        PYTHON: 71 # 3.8.1
        JAVASCRIPT: 63 # Node.js 12.14.0
        TYPESCRIPT: 74 # 3.7.4
        CPP: 54 # GCC 9.2.0
      # Judge0 caps these at its own MAX_* settings — 15s CPU and 20s wall by
      # default — and rejects the entire batch with a 422 if either is exceeded.
      cpu-time-limit: PT5S
      wall-time-limit: PT10S
      memory-limit-kb: 256000
      # Where Judge0 reports each finished submission — this backend as seen from
      # inside the Judge0 containers. Behind several instances, point it at the
      # load balancer: whichever instance receives a callback forwards it over
      # RabbitMQ to the one waiting for it.
      callback-url: http://host.docker.internal:8080
      # How long to wait for the callbacks before asking Judge0 directly, once,
      # and giving up if it still has not finished.
      result-timeout: PT60S
      connect-timeout: PT5S
      read-timeout: PT30S
