# The one way in: the app, its API and its WebSocket, all on one origin, so the
# browser never makes a cross-origin call and the session cookie just works.
#
#   /api/  -> the backend instances, round robin
#   /ws/   -> the backend instances, one SockJS session always to the same one
#   /      -> the frontend container, which serves the built app

# Which backend answered each request, so the load balancing can be seen in
# `docker logs codeforge-nginx`.
log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr time=$request_time';

# Docker's embedded DNS, asked again every few seconds: a backend container that
# restarts may come back on another address, and `resolve` below finds it again
# without nginx having to be restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend-1:8080 resolve;
    server backend-2:8080 resolve;
    keepalive 16;
}

# A WebSocket is a single connection, so it needs nothing special. SockJS's
# fallbacks for networks that block WebSockets are not: they carry one session
# over many HTTP requests, and every one of them has to reach the instance that
# holds that session. The session id is in the path —
# /ws/{server}/{session}/{transport} — so the choice of instance is a hash of it.
# Anything without one (/ws/info) goes anywhere.
map $uri $sockjs_session {
    ~^/ws/[^/]+/(?<session>[^/]+)/  $session;
    default                         $request_id;
}

upstream backend_sockjs {
    zone backend_sockjs 64k;
    hash $sockjs_session consistent;
    server backend-1:8080 resolve;
    server backend-2:8080 resolve;
}

upstream frontend {
    zone frontend 64k;
    server frontend:80 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Replaces the image's default access log rather than adding a second one.
    access_log /var/log/nginx/access.log upstream;

    # Judge0 reports results to each backend directly, inside the Compose
    # network. The endpoint has no reason to be reachable from outside it.
    location /api/judge0/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run or a submission is answered when the judge calls back, which can
        # outlast nginx's default of 60s; the backend gives up at 90s itself.
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend_sockjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SockJS's streaming fallback sends as it goes; buffering would hold
        # messages back until the response ended.
        proxy_buffering off;
        # Heartbeats keep a live connection talking every 10s; this only ends
        # connections that have genuinely gone quiet.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}
