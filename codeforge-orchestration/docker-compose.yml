# CodeForge in Docker, in one of two shapes.
#
#   docker compose up -d
#       Only what the application depends on: MySQL, Judge0 and RabbitMQ. For
#       development — the backend runs from the IDE (or `./gradlew bootRun`) on
#       port 8080, the frontend from `npm run dev` on 5173, and both reach these
#       containers on their published localhost ports.
#
#   docker compose --profile app up -d --build
#       The whole application as well: the backend as two replicas, the
#       frontend, and nginx in front of them on http://localhost
#       (CODEFORGE_HTTP_PORT to move it). Stop it with
#       `docker compose --profile app down`.
#
# The two can run at once; they share the database and the broker, and a
# backend started from the IDE simply joins the others.
#
# The schema is Liquibase's (codeforge-backend/src/main/resources/db/changelog):
# whichever backend starts first against an empty database creates every
# table, the Quartz ones included, and the first admin account. The others wait
# on Liquibase's lock meanwhile, so the replicas can all start at once.
#
# Judge0 runs submitted code, so its containers are privileged and its ports are
# bound to 127.0.0.1 only. Two things about the image are worth knowing before
# debugging it:
#
#   * it is published for linux/amd64 only, so on Apple Silicon it runs emulated
#     — correct, but slower than the reported times suggest;
#   * it needs cgroup v1. On Docker Desktop that means "DeprecatedCgroupv1": true
#     in ~/Library/Group Containers/group.com.docker/settings-store.json,
#     followed by a restart of the VM.
#
# Judge0 reports each finished submission by calling the backend back (see
# `callback-url` in application.yml). A replica gives its own container
# hostname in that URL (application-docker.yml); a backend on the host is
# reached through `host.docker.internal`.

services:
  mysql:
    image: mysql:8.4
    container_name: codeforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codeforge
      MYSQL_USER: codeforge
      MYSQL_PASSWORD: codeforge
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Judge0 ────────────────────────────────────────────────────────────────
  # The API the backend talks to. It only enqueues work; nothing runs here.
  judge0-server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    container_name: codeforge-judge0-server
    restart: unless-stopped
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - '127.0.0.1:2358:2358'
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started

  # Where submissions are actually compiled and run, under isolate.
  judge0-workers:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    container_name: codeforge-judge0-workers
    restart: unless-stopped
    privileged: true
    command: ['./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # Where the callbacks go. Docker Desktop resolves the name by itself; on a
    # Linux engine it only exists because of this line.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started

  judge0-db:
    image: postgres:16-alpine
    container_name: codeforge-judge0-db
    restart: unless-stopped
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U judge0 -d judge0']
      interval: 5s
      timeout: 5s
      retries: 20

  judge0-redis:
    image: redis:7-alpine
    container_name: codeforge-judge0-redis
    restart: unless-stopped
    # Judge0 uses Redis as a work queue, not as a cache, so it must require the
    # password the workers are configured with.
    command: ['redis-server', '--appendonly', 'no', '--requirepass', 'judge0redis']

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  # The one thing every backend instance shares besides the database. Two jobs:
  #
  #   * STOMP (61613) is the WebSocket broker. Each instance relays its browser
  #     sessions here, so an event published on one instance reaches a browser
  #     connected to another.
  #   * AMQP (5672) carries Judge0 callbacks to the instance that is waiting
  #     for them, whichever instance Judge0 happened to call.
  #
  # The management UI is on http://localhost:15672 (codeforge / codeforge).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: codeforge-rabbitmq
    restart: unless-stopped
    # The default guest account only accepts loopback connections, and the
    # backend arrives from outside the container.
    environment:
      RABBITMQ_DEFAULT_USER: codeforge
      RABBITMQ_DEFAULT_PASS: codeforge
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:61613:61613'
      - '127.0.0.1:15672:15672'
    volumes:
      # Management plus STOMP; the image enables only the former by itself.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20

  # ── The application (--profile app) ──────────────────────────────────────
  # One image, run as two replicas (`--scale backend=N` for another count).
  # Each runs its own copy of everything; what they share is:
  #
  #   * the database — Liquibase's lock means one replica migrates while the
  #     others wait, and Quartz clusters through it, so a contest alarm fires
  #     on exactly one replica;
  #   * RabbitMQ — live updates reach browsers connected to any replica, and a
  #     Judge0 callback that lands on the wrong one is forwarded to the right
  #     one.
  #
  # No container_name or hostname, which a replicated service cannot have:
  # Compose names them codeforge-orchestration-backend-1, -2, … and each
  # container's hostname is its short id, which the Compose network resolves
  # to that one container. `backend` resolves to all of them.
  backend:
    build: ../codeforge-backend
    image: codeforge-backend
    profiles: [app]
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      # Every dependency by its service name, and each replica's own address
      # for the Judge0 callbacks — see application-docker.yml.
      SPRING_PROFILES_ACTIVE: docker
    mem_limit: 1536m
    # Nothing published: nginx is the way in, and Judge0 reaches each replica
    # on the Compose network.
    expose:
      - '8080'
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      judge0-server:
        condition: service_started

  # Serves the built app. The API address is left empty at build time, so the
  # app calls its own origin, and nginx routes those calls to the backend.
  frontend:
    build: ../codeforge-frontend
    image: codeforge-frontend
    container_name: codeforge-frontend
    profiles: [app]
    restart: unless-stopped

  # The way in: the app, /api and /ws on one origin. See nginx/default.conf.
  nginx:
    image: nginx:1.29-alpine
    container_name: codeforge-nginx
    profiles: [app]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CODEFORGE_HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  mysql-data:
  judge0-db-data:
