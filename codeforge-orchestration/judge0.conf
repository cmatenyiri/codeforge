# Judge0 configuration. The full set of knobs is documented at
# https://github.com/judge0/judge0/blob/master/judge0.conf
#
# This file is read by the judge0 containers *and* used as the env_file for
# Postgres and Redis, which is why the credentials appear under the names each
# of those images expects.

################################################################################
# Judge0 Server
################################################################################
# Leave empty to run unauthenticated. That is only acceptable while the port is
# bound to localhost: an open Judge0 executes arbitrary code for anyone who can
# reach it.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

################################################################################
# Judge0 Workers
################################################################################
# One worker is right for a single developer. Raising it multiplies the memory
# the sandbox can hold at once (COUNT * MAX_MEMORY_LIMIT).
COUNT=1

################################################################################
# Judge0 Server Resource Limits
################################################################################
# The ceilings a submission may ask for; the backend's own limits in
# application.yml must stay at or below these or Judge0 rejects the batch.
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=120
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

################################################################################
# Redis
################################################################################
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

################################################################################
# PostgreSQL
################################################################################
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pg

################################################################################
# Rails
################################################################################
RAILS_ENV=production
RAILS_MAX_THREADS=5
